<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ate Jo's Kitcheneria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="icon" id="fav" href="">
<style>
/* Layout: sticky brand bar over one 820px column. Documents render as light "paper" sheets in both themes. */
:root{
 --bg:#fbf9f4;--card:#ffffff;--tx:#1e1b16;--mu:#6b6357;--bd:#e7e0d1;--soft:#fdf3d3;
 --ac:#f2b705;--on-ac:#1e1b16;--lk:#8a5d00;
 --ok:#1f7a4d;--okb:#e3f3ea;--wn:#8a5d00;--wnb:#fdf3d3;--bad:#b42318;--badb:#fde8e6;
 --paper:#ffffff;--ink:#1e1b16;--ink2:#5f584c;--rule:#d9d1bf;--band:#f6efdc;
 --lgl:inline-block;--lgd:none;
 --fd:"Bitter",Georgia,serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--card:#201b15;--tx:#f3ede2;--mu:#b3a893;--bd:#3a3227;--soft:#3a2f12;--ac:#f5c542;--on-ac:#1e1b16;--lk:#f5c542;--ok:#5fd39a;--okb:#16352a;--wn:#f5c542;--wnb:#3a2f12;--bad:#ff8a7f;--badb:#3d1c19;--lgl:none;--lgd:inline-block;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15120e;--card:#201b15;--tx:#f3ede2;--mu:#b3a893;--bd:#3a3227;--soft:#3a2f12;--ac:#f5c542;--on-ac:#1e1b16;--lk:#f5c542;--ok:#5fd39a;--okb:#16352a;--wn:#f5c542;--wnb:#3a2f12;--bad:#ff8a7f;--badb:#3d1c19;--lgl:none;--lgd:inline-block;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--fb)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--lk)}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;line-height:1.2}
h2{font-size:24px;margin:28px 0 10px}h3{font-size:18px;margin:0 0 6px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
header.top .wrap{padding-block:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--tx);min-width:0}
.brand img{width:38px;height:38px}
.brand span{font:700 19px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.nv{display:flex;gap:4px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
nav.nv a{padding:5px 12px;border-radius:99px;color:var(--tx);text-decoration:none;white-space:nowrap;font-size:15px;font-weight:500}
nav.nv a.on{background:var(--ac);color:var(--on-ac)}
main{padding-block:12px 120px}
footer.ft{border-top:1px solid var(--bd);color:var(--mu);font-size:14px}
footer.ft .wrap{padding-block:24px 90px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
button,select,input,textarea,.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
input,select,textarea{width:100%;margin:3px 0 10px}input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--ac)}
button,.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:500}
button.p,.btn.p{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.g{background:none;border-color:transparent;color:var(--mu)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label.mu{display:block}
.mu{color:var(--mu);font-size:14px}.sm{font-size:13px;color:var(--ink2)}
.tag{display:inline-block;background:var(--soft);color:var(--wn);border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.n{background:var(--bd);color:var(--tx)}
.warn{background:var(--wnb);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.err{background:var(--badb);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.tot{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:700;color:var(--lk);margin:0}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:center;padding:18px 0 6px}
.hero .lg{width:100%;max-width:220px}.lgL{display:var(--lgl)}.lgD{display:var(--lgd)}
.hero h2{font-size:32px;margin:6px 0 8px}
.hphoto{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-top:10px}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .lg{max-width:200px;margin:auto}.hero .row{justify-content:center}.hero h2{font-size:27px}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;counter-increment:s;font-size:14.5px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ac);color:var(--on-ac);font:700 15px var(--fd);margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.tile img,.tile .phx{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.tile b{display:block;padding:8px 10px 10px;font-size:15px}
.phx{background:var(--soft);display:grid!important;place-items:center;font:600 14px var(--fd);color:var(--wn)}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
/* menu */
.dish{display:flex;gap:12px;align-items:center}
.th{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none}
.price{text-align:right;flex:none;display:grid;gap:6px;justify-items:end}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
/* cart */
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.ci:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;padding:0;justify-content:center}
.qty b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.amt{text-align:right;font-variant-numeric:tabular-nums;min-width:78px}
.sumt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.sumt td{padding:3px 0}.sumt td:last-child{text-align:right}
.sumt tr.big td{font-weight:700;font-size:18px;border-top:1px solid var(--bd);padding-top:8px}
.fab{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.fab .wrap{padding-block:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:20;font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.mbox{background:var(--card);border-radius:14px;padding:18px;max-width:420px;width:100%;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
/* paper documents */
.paper{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:22px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.paper .sm{color:var(--ink2)}
.ph{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px}
.ph img{width:84px;flex:none}
.ph .pb{font:700 18px var(--fd)}
.ph .who{flex:1;min-width:0;font-size:13px;color:var(--ink2)}
.ph .ttl{text-align:right;flex:none}.ph .ttl b{display:block;font:700 15px var(--fd);text-transform:uppercase;letter-spacing:.06em}
.ph .ttl span{font:600 15px ui-monospace,Menlo,Consolas,monospace}
.pinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;margin:14px 0;font-size:14px}
.pinfo div{display:flex;gap:8px}.pinfo dt{color:var(--ink2);min-width:96px}.pinfo dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tw{overflow-x:auto}
table.it{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.mq{display:none}
table.it th{background:var(--band);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--rule)}
table.it td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.it .r{text-align:right;white-space:nowrap}table.it .c{text-align:center}
table.it tfoot td{border-bottom:0;padding:4px 8px}
table.it tfoot tr.b td{font-weight:700;font-size:15px}
table.it tfoot tr.first td{padding-top:10px}
table.it tfoot tr.grand td{border-top:2px solid var(--ink);font-size:16px;padding-top:8px}
.stamp{display:inline-block;margin-top:12px;border:2px solid currentColor;border-radius:6px;padding:4px 10px;font:700 13px var(--fd);text-transform:uppercase;letter-spacing:.06em}
.stamp.ok{color:#1f7a4d}.stamp.bad{color:#b42318}.stamp.wn{color:#8a5d00}
.pf{text-align:center;color:var(--ink2);font-size:13px;margin:14px 0 0}
@media (max-width:560px){.paper{padding:14px}.ph{flex-wrap:wrap}.ph img{width:64px}.ph .ttl{text-align:left;width:100%}.paper .u{display:none}.mq{display:block}table.it th,table.it td{padding:7px 5px}table.it tfoot td.tl{white-space:normal}.pinfo dt{min-width:80px}}
/* back office */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:700 24px var(--fd);font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--mu)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.oi{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}.oi td{padding:4px 0;border-bottom:1px dashed var(--bd);vertical-align:top}.oi td.r{text-align:right;white-space:nowrap;padding-left:10px}
.oc{border-left-width:4px}.oc.s0{border-left-color:var(--bad)}.oc.s1,.oc.s2,.oc.s3,.oc.s4{border-left-color:var(--ac)}.oc.s5{border-left-color:var(--ok)}.oc.s6{border-left-color:var(--bd);opacity:.75}
.ctab{width:100%;border-collapse:collapse}.ctab td{padding:3px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}body{background:#fff}.paper{border:0;box-shadow:none;padding:0;margin:0}@page{margin:14mm}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<footer class="ft"><div class="wrap" id="ft"></div></footer>
<div id="pr"></div><div id="toast" hidden></div><div id="modal" hidden></div>

function calc(){const sub=cart.reduce((a,c)=>a+c.p*c.q,0),del=$("#md")?.value=="delivery",fee=del?(+cfg.areas[$("#ar")?.value]?.f||0):0,w=toW($("#tm")?.value),hrs=(w-Date.now())/36e5;

 $("#app").innerHTML=`<h2 style="margin-top:8px">${editing?`Edit order ${esc(LO.id)}`:"Your order"}</h2>${notice()}${editing?`<div class="warn">You’re editing a sent order. After saving, send the updated order to us again.</div>`:""}

 if(F.md)$("#md").value=F.md;if(F.ar)$("#ar").value=F.ar;if(F.pm)$("#pm").value=F.pm;fee();pd()};
function pd(){const p=cfg.pays[$("#pm").value];$("#pd").innerHTML=p?`Send your down payment to:<br><b>${esc(p.n)}</b> · ${esc(p.d)}`:""}
function fee(){const c=calc();$("#dv").hidden=$("#md").value!="delivery";

 const prev=editing?(LO.dp||0):0,diff=c.dp-prev;
 $("#sm").innerHTML=`<table class="sumt"><tr><td>Subtotal</td><td>${m(c.sub)}</td></tr>${c.fee?`<tr><td>Delivery fee</td><td>${m(c.fee)}</td></tr>`:""}${c.rush?`<tr><td>Rush fee</td><td>${m(c.rush)}</td></tr>`:""}<tr class="big"><td>Total</td><td>${m(c.total)}</td></tr><tr><td>Down payment (${cfg.dp}%)</td><td><b>${m(c.dp)}</b></td></tr>${editing?`<tr><td>Already sent</td><td>− ${m(prev)}</td></tr><tr class="big"><td>${diff>0?"Difference to send now":"Nothing more to send now"}</td><td>${m(Math.max(0,diff))}</td></tr>`:""}<tr><td class="mu">Balance on delivery day</td><td class="mu">${m(c.bal)}</td></tr></table>`;

 if(!g("nm")||!g("ph")||!g("tm")||(del&&!g("ad")))return e("Please fill in your name, mobile number, date & time"+(del?" and address":"")+".");
 if(g("ph").replace(/\D/g,"").length<10)return e("Please check your mobile number. It should have at least 10 digits, e.g. 0917 123 4567.");
 if(c.hrs<cfg.minH)return e("Please choose a time at least "+cfg.minH+" hours from now.");
 if(c.isRush&&!F.ag)return e("Please agree to the rush fee to continue, or choose a later date.");
 if(!g("rf"))return e("Please send the down payment first, then enter the payment reference number.");
 const old=editing?(LO.refs||[LO.ref]):[],rs=old.includes(g("rf"))?old:old.concat(g("rf"));
 const o={id:editing?LO.id:"K"+Date.now().toString(36).toUpperCase().slice(-6),rev:editing?(LO.rev||1)+1:1,at:editing?LO.at:Date.now(),ed:editing?Date.now():0,name:g("nm"),ph:g("ph"),mode:g("md"),area:del?cfg.areas[$("#ar").value]?.n:"",addr:del?g("ad"):"",when:c.w,note:g("nt"),pm:cfg.pays[$("#pm").value]?.n||"",ref:g("rf"),refs:rs,prevDp:editing?LO.dp:0,items:cart.map(({d,nm,det,p,t,tn,ids,q})=>({d,nm,det,p,t,tn,ids,q})),sub:c.sub,fee:c.fee,rush:c.rush,total:c.total,dp:c.dp,dpPct:cfg.dp,bal:c.bal};
 LO=o;S("kc_last4",o);cart=[];sc();F={};editing=false;badge();$("#app").innerHTML=`<h2 style="margin-top:8px">One last step</h2>`+conf(o,"Send your order to us");scrollTo(0,0)}
function msgOf(o){const L=[`${cfg.biz.toUpperCase()} · PRE-ORDER ${o.id}${o.rev>1?` (UPDATED, revision ${o.rev})`:""}`,`Name: ${o.name}`,`Mobile: ${o.ph}`,o.mode=="delivery"?`Delivery: ${o.area} - ${o.addr}`:"Pickup",`Needed: ${fdt(o.when)}`,"","ITEMS"];
 o.items.forEach((i,n)=>{L.push(`${n+1}) ${iNm(i)}${iDet(i)?" - "+iDet(i):""}`,`    ${i.q} x ${m(i.p)} = ${m(i.p*i.q)}`)});
 L.push("",`Subtotal: ${m(o.sub)}`);if(o.fee)L.push(`Delivery fee: ${m(o.fee)}`);if(o.rush)L.push(`Rush fee: ${m(o.rush)}`);
 L.push(`TOTAL: ${m(o.total)}`,`Down payment ${dpPct(o)}%: ${m(o.dp)} via ${o.pm}, ref ${refs(o)}`);if(o.rev>1&&o.dp>o.prevDp)L.push(`Difference sent for this revision: ${m(o.dp-o.prevDp)}`);

// t: "sum" = customer order receipt (website), "inv" = sales invoice, "slip" = kitchen order slip (back office only)
function docModel(o,t){const R=ref(o),rv=o.rev>1?` (rev. ${o.rev})`:"",pay=`${o.pm}${refs(o)?" · ref "+refs(o):""}`;
 const info=[];if(t=="inv")info.push(["Order no.",R+rv]);
 info.push(["Ordered",fdt(o.at)],[o.mode=="delivery"?"Delivery":"Pickup",fdt(o.when)],["Customer",o.name],["Mobile",o.ph]);

 <select style="width:auto;margin:0" aria-label="Status" onchange="ox('${x.id}','st',this.value)">${STS.map(t=>`<option ${t==x.st?"selected":""}>${t}</option>`).join("")}</select></div>
 <div class="row"><button onclick="BO.open['${x.id}']=${op?"0":"'inv'"};ordersP()">${op=="inv"?"Hide invoice":"View invoice"}</button><button onclick="BO.open['${x.id}']=${op=="slip"?"0":"'slip'"};ordersP()">${op=="slip"?"Hide slip":"View slip"}</button>
 ${canPrint()?`<button onclick="printDoc(ord('${x.id}'),'slip')">Print slip</button><button onclick="printDoc(ord('${x.id}'),'inv')">Print invoice</button>`:""}<button onclick="saveDoc(ord('${x.id}'),'slip')">Slip (Word)</button><button onclick="saveDoc(ord('${x.id}'),'inv')">Invoice (Word)</button><button class="g" onclick="od('${x.id}')">Delete</button></div>
 ${op?docHTML(docModel(x,op)):""}</div>`}
function ox(id,k,v){const l=getOrders(),o=l.find(x=>x.id==id);o[k]=v;if(k=="dpOk"&&v){if(o.st==STS[0])o.st="Confirmed";o.dpUp=0}if(k=="balOk"&&v&&!o.dpOk)o.dpOk=1;setOrders(l);ordersP()}
function od(id){ask(`Delete order ${no(ord(id))}? This can’t be undone.`).then(y=>{if(y){setOrders(getOrders().filter(x=>x.id!=id));ordersP()}})}
// generic field helpers (path-based)
const fld=(l,p,t)=>{const id="f_"+p.replace(/\./g,"_");return `<label class="mu" for="${id}">${l}</label><input id="${id}" ${t||""} value="${esc(gp(p))}" onchange="sp('${p}',this.type=='number'?+this.value:this.value)">`};
const tfld=(l,p,r)=>{const id="f_"+p.replace(/\./g,"_");return `<label class="mu" for="${id}">${l}</label><textarea id="${id}" rows="${r||3}" onchange="sp('${p}',this.value)">${esc(gp(p))}</textarea>`};
const imf=(p,mx,png)=>{const v=gp(p);return v?`<span class="row">${im(v,"th")}<button class="g" onclick="sp('${p}','');admin()">Remove photo</button></span>`:`<label class="btn">Add photo (optional)<input type="file" accept="image/*" hidden onchange="upi('${p}',${mx},this.files[0],null,${png?1:0})"></label>`};
function upi(p,mx,f,cb2,png){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);const u=png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.75);if(cb2)cb2(u);else{sp(p,u);admin()}};i.src=r.result};r.readAsDataURL(f)}
const del=(what,fn)=>ask(`Delete this ${what}?`).then(y=>y&&fn());
function menuP(){$("#pane").innerHTML=`<div class="mu">“Add-on / price” is the extra charge in combos for combo categories, or the item’s own price for à la carte categories (like Desserts). Untick Available to show a dish as not available.</div>`+cfg.dishes.map((d,i)=>`<div class="card"><div class="row sp">${imf("dishes."+i+".im",600)}<label class="row"><input type="checkbox" ${d.a?"checked":""} onchange="sp('dishes.${i}.a',this.checked?1:0)"> Available</label></div>${fld("Name","dishes."+i+".n")}
 <div class="row"><div class="grow"><label class="mu">Category</label><select onchange="sp('dishes.${i}.c',this.value)">${cfg.cats.map(c=>`<option ${c.n==d.c?"selected":""}>${esc(c.n)}</option>`).join("")}</select></div><div class="grow">${fld("Add-on / price","dishes."+i+".s",'type="number" min="0"')}</div></div>${tfld("Description (optional)","dishes."+i+".ds",2)}<button class="g" onclick="del('dish',()=>{sv(c=>c.dishes.splice(${i},1));menuP()})">Delete dish</button></div>`).join("")+`<button class="p" onclick="sv(c=>c.dishes.push({id:'d'+Date.now(),n:'New dish',c:c.cats[0]?.n||'',s:0,a:1,im:'',ds:''}));menuP()">+ Add dish</button>`}
function combosP(){const cc=cmCats(),sel=(x,i,j)=>`<td><select aria-label="Category ${j+1}" style="margin:0" onchange="sp('combos.${i}.c.${j}',this.value)"><option value="">—</option>${cc.map(c=>`<option ${x.c[j]==c?"selected":""}>${esc(c)}</option>`).join("")}</select></td>`;
 $("#pane").innerHTML=`<div class="mu">Each row is one allowed combination of categories and its base price. Leave the third slot as “—” for a 2-dish combo. Order doesn’t matter.</div><div class="tw"><table class="ctab" style="min-width:480px">${cfg.combos.map((x,i)=>`<tr>${sel(x,i,0)}${sel(x,i,1)}${sel(x,i,2)}<td><input type="number" aria-label="Price" style="width:84px;margin:0" value="${x.p}" onchange="sp('combos.${i}.p',+this.value)"></td><td><button class="g" aria-label="Delete row" onclick="sv(c=>c.combos.splice(${i},1));combosP()">✕</button></td></tr>`).join("")}</table></div><button class="p" onclick="sv(c=>c.combos.push({c:['','',''],p:0}));combosP()">+ Add combination</button>`}
function webP(){$("#pane").innerHTML=`<div class="card"><h3>Home banner</h3>${fld("Headline","hero.t")}${tfld("Subtitle","hero.s",2)}${imf("hero.im",1400)}</div>
 <div class="card"><h3>About page</h3>${fld("Title","about.t")}${tfld("Text (blank line = new paragraph)","about.x",8)}${imf("about.im",1000)}</div>
 <div class="card"><h3>Gallery</h3><div class="row">${cfg.gal.map((g,i)=>`<div>${im(g,"th")}<br><button class="g" onclick="sv(c=>c.gal.splice(${i},1));webP()">Remove</button></div>`).join("")}</div><label class="btn">+ Add photo<input type="file" accept="image/*" hidden onchange="upi('',900,this.files[0],u=>{sv(c=>c.gal.push(u));webP()})"></label></div>
 <div class="card"><h3>Contact info</h3>${fld("Opening hours","hours")}${fld("Map link (Google Maps share link)","map")}</div>
 <div class="card"><h3>FAQ</h3>${cfg.faq.map((f,i)=>`${fld("Question","faq."+i+".q")}${tfld("Answer","faq."+i+".a",2)}<button class="g" onclick="sv(c=>c.faq.splice(${i},1));webP()">Delete</button><hr style="border:0;border-top:1px solid var(--bd)">`).join("")}<button onclick="sv(c=>c.faq.push({q:'New question',a:''}));webP()">+ Add question</button></div>`}
function setP(){$("#pane").innerHTML=`<div class="card"><h3>Business</h3>${fld("Business name","biz")}${fld("Tagline","tag")}${fld("Address (shown on website and invoices)","addr")}${fld("TIN / business no. (optional, shown on invoices)","tin")}${fld("Currency symbol","cur")}${fld("Invoice and receipt footer","foot")}
 <label class="mu">Logo (a transparent PNG works best)</label><div class="row" style="margin-bottom:10px"><img src="${esc(logoL())}" alt="" style="width:90px;background:#fff;border-radius:8px;padding:4px">${cfg.logo?`<button class="g" onclick="sp('logo','');render()">Use the default logo</button>`:`<label class="btn">Replace logo<input type="file" accept="image/*" hidden onchange="upi('logo',480,this.files[0],u=>{sp('logo',u);render()},1)"></label>`}</div>
 <label class="mu">Accent color</label><div class="row"><input type="color" style="width:60px;padding:2px" value="${cfg.ac||"#f2b705"}" onchange="sp('ac',this.value);render()"><button class="g" onclick="sp('ac','');render()">Reset color</button></div></div>
 <div class="card"><h3>Where customers send orders</h3><div class="mu">Blank hides a channel. Viber/SMS need the country code, e.g. 639171234567. Facebook is your page username.</div>${fld("Viber number","ch.viber")}${fld("Facebook page username","ch.fb")}${fld("SMS number","ch.sms")}</div>
 <div class="card"><h3>Pre-order rules</h3>${fld("Accept orders this many days ahead","lead",'type="number" min="0"')}${fld("Earliest allowed: hours from now (rush orders)","minH",'type="number" min="0"')}${fld("Rush fee","rush",'type="number" min="0"')}${fld("Down payment %","dp",'type="number" min="0" max="100"')}<label class="row"><input type="checkbox" ${cfg.mode.pickup?"checked":""} onchange="sp('mode.pickup',this.checked?1:0)"> Pickup</label><label class="row" style="margin-top:6px"><input type="checkbox" ${cfg.mode.delivery?"checked":""} onchange="sp('mode.delivery',this.checked?1:0)"> Delivery</label></div>
 <div class="card"><h3>Payment methods</h3>${cfg.pays.map((p,i)=>`${fld("Name","pays."+i+".n")}${fld("Account details","pays."+i+".d")}<button class="g" onclick="del('payment method',()=>{sv(c=>c.pays.splice(${i},1));setP()})">Delete</button><hr style="border:0;border-top:1px solid var(--bd)">`).join("")}<button onclick="sv(c=>c.pays.push({n:'New method',d:''}));setP()">+ Add method</button></div>
 <div class="card"><h3>Party trays (fixed price per size)</h3>${cfg.trays.map((t,i)=>`<div class="row"><div class="grow">${fld("Pax","trays."+i+".n",'type="number" min="1"')}</div><div class="grow">${fld("Price (0 = ask for a quote)","trays."+i+".p",'type="number" min="0"')}</div></div>${tfld("Description","trays."+i+".ds",2)}${imf("trays."+i+".im",600)} <button class="g" onclick="del('tray size',()=>{sv(c=>c.trays.splice(${i},1));setP()})">Delete tray</button><hr style="border:0;border-top:1px solid var(--bd)">`).join("")}<button onclick="sv(c=>c.trays.push({n:60,p:0,ds:'',im:''}));setP()">+ Add tray size</button></div>
 <div class="card"><h3>Delivery areas &amp; fees</h3>${cfg.areas.map((a,i)=>`<div class="row"><input class="grow" aria-label="Area name" value="${esc(a.n)}" onchange="sp('areas.${i}.n',this.value)"><input type="number" aria-label="Fee" style="width:96px" value="${a.f}" onchange="sp('areas.${i}.f',+this.value)"><button class="g" aria-label="Delete area" onclick="sv(c=>c.areas.splice(${i},1));setP()">✕</button></div>`).join("")}<button onclick="sv(c=>c.areas.push({n:'New area',f:0}));setP()">+ Add area</button></div>
 <div class="card"><h3>Menu categories</h3><div class="mu">Untick “combo” for à la carte categories like Desserts.</div>${cfg.cats.map((x,i)=>`<div class="row"><input class="grow" aria-label="Category name" value="${esc(x.n)}" onchange="cr(${i},this.value)"><label class="row"><input type="checkbox" ${x.c?"checked":""} onchange="sp('cats.${i}.c',this.checked?1:0)"> combo</label><button class="g" aria-label="Delete category" onclick="cx(${i})">✕</button></div>`).join("")}<button onclick="sv(c=>c.cats.push({n:'New category',c:0}));setP()">+ Add category</button></div>`}
function cr(i,v){sv(c=>{const o=c.cats[i].n;c.cats[i].n=v;c.dishes.forEach(d=>{if(d.c==o)d.c=v});c.combos.forEach(x=>x.c=x.c.map(y=>y==o?v:y))})}
function cx(i){if(cfg.dishes.some(d=>d.c==cfg.cats[i].n))return say("Move or delete the dishes in this category first.");sv(c=>c.cats.splice(i,1));setP()}
render();
</script></body></html>
